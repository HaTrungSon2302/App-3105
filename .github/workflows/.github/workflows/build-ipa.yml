name: Build Tizi Mod IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build Payload Tizi-Mod-unsigned.ipa

          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/build" -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle was produced."
            find "$PWD/build" -maxdepth 2 -print || true
            exit 1
          fi

          echo "Packaging: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Tizi-Mod-unsigned.ipa
          ls -lh Tizi-Mod-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tizi-Mod-unsigned-IPA
          path: Tizi-Mod-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
